global:
  domain: argocd.local

server:
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: http
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - argocd.local
    paths:
      - /
      
repoServer:
  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: 8084
    initialDelaySeconds: 120
    timeoutSeconds: 15
    periodSeconds: 20
    failureThreshold: 5
      
configs:
  params:
    server.insecure: "true"
