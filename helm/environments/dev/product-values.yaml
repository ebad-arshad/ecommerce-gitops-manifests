# Replica and History Settings
replicaCount: 1
revisionHistoryLimit: 3
# Init Container
initContainers:
  enabled: true
  name: wait-for-db
  image: busybox:1.28
  command:
    - sh
    - -c
    - "until nc -zv postgresql 5432; do echo waiting for db; sleep 2; done;"
# Image Settings
image:
  name: "ebadarshad/prod-product:v2.0.0"
  pullPolicy: IfNotPresent
# Networking
service:
  port: 5002
# Ingress Settings
ingress:
  enabled: false
  # path: /dev(/|$)(.*) 
# Resources (Must be set for HPA to work)
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
# Health Checks (Probes)
probes:
  startupPath: "/healthz"
  startupDelay: 30
  livenessPath: "/healthz"
  livenessDelay: 15
  readinessPath: "/healthz"
  readinessDelay: 5
# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  cpu:
    averageUtilization: 70
  memory:
    averageUtilization: 80
# Extra Envs
extraEnv:
  # 1. TELL THE CODE WHERE THE DB LIVES
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_USER: "product_user"           # Change to your specific DB admin user if different
  DB_NAME: "product"          # Change to your specific database name
  
  # 2. MATCH THE VAULT SECRET PROPERTIES WE RETRIEVED (MAPPED TO THE CONTAINER SCRIPT EXPECTATIONS)
  # If your base chart requires mapping keys manually from a secret, map them here:
  DB_PASSWORD:
    secretKeyRef:
      name: postgres-init-secrets
      key: PRODUCT_PASS   

  RABBITMQ_PRODUCT_QUEUE: product
  RABBITMQ_ORDER_QUEUE: order
